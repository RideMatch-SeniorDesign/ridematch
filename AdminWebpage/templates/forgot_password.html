<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot Password | RideMatch Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <div class="brand">RideMatch Admin</div>
      <h1>Reset your password</h1>
      <p>Enter the email address assigned to your admin account.</p>
      {% if message %}
      <div class="success" role="status">{{ message }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('forgot_password') }}">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <button type="submit">Email Reset Link</button>
      </form>
      <p class="helper"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </main>
  </body>
</html>
