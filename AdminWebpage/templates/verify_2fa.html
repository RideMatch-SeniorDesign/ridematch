<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify Sign-in | RideMatch Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <div class="brand">RideMatch Admin</div>
      <h1>Verify sign-in</h1>
      <p>Enter the six-digit code from your authenticator app.</p>
      {% if error %}
      <div class="error" role="alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('verify_two_factor') }}">
        <label for="code">Authentication code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus />
        <button type="submit">Verify</button>
      </form>
    </main>
  </body>
</html>
