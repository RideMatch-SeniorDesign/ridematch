<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose New Password | RideMatch Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <div class="brand">RideMatch Admin</div>
      <h1>Choose a new password</h1>
      <p>Use at least 12 characters. You will still need your authenticator code when signing in.</p>
      {% if error %}
      <div class="error" role="alert">{{ error }}</div>
      {% endif %}
      <form method="post">
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required />
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required />
        <button type="submit">Reset Password</button>
      </form>
      <p class="helper"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </main>
  </body>
</html>
